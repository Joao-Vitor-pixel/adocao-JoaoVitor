<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body class="login-1">
    
 <div align="center">
    <div class="content" align="left">
    
        <h1 class="title-2 " style="margin-top:10vh ;">Login!</h1>
        <p class="text-info-2" style="margin-top:-10px;">Utilize suas credenciais para logar </p>
        
        <form>
        <input type="email" class="input-login top5" placeholder="Mail" required>
        
        <input type="password" class="input-login top3" placeholder="Password" required>
        <p class="text-info-2" style="float:right;">Esqueceu sua senha?</p>

        <button class="btn-login" style="margin-top: 10vh;">Logar</button>
        </form>
        <p class="text-info-2">Ainda não possui uma conta? <a href="#">Cadastre-se</a></p>
        
        
    </div>  
    <div align="center" class="footer-info">   
        <p class="text-info-2" style="font-size: 12px !important;width: 60%;">Para logar você precisa aceitar os <a href="#">Termos de Uso</a> e <a href="#">Politica de Privacidade</a></p>   
    </div> 
</div>

</body>
</html>
